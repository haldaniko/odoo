name: odoo-hashtaghub

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER:-odoo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - odoo-prod-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-odoo} -d postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  odoo:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER:-odoo}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
      ODOO_RC: /etc/odoo/odoo.prod.conf
    ports:
      - "${ODOO_HTTP_PORT:-8269}:8069"
      - "${ODOO_LONGPOLLING_PORT:-8272}:8072"
    volumes:
      - odoo-prod-web-data:/var/lib/odoo
      - ./custom-addons:/mnt/extra-addons:ro
      - ./docker/odoo.prod.conf:/etc/odoo/odoo.prod.conf:ro
    command: ["odoo"]
    restart: unless-stopped

volumes:
  odoo-prod-db-data:
    name: odoo-hashtaghub-db-data
  odoo-prod-web-data:
    name: odoo-hashtaghub-web-data
